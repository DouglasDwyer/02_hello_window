[package]
name = "wgpu-example-02-hello-window"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
env_logger = "0.11"
pollster = "0.4"

# Uncomment these to get old behavior
#wgpu = { git = "https://github.com/DouglasDwyer/wgpu", branch = "dx12-discard-latency-fix", default-features = false, features = [ "dx12" ] }
#winit = { version = "0.30.8" }

# These have the new behavior
wgpu = { git = "https://github.com/DouglasDwyer/wgpu", branch = "personal/all-fixes", default-features = false, features = [ "dx12" ] }
winit = { git = "https://github.com/DouglasDwyer/winit", branch = "personal/all-fixes" }