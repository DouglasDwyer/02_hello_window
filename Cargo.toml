[package]
name = "wgpu-example-02-hello-window"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
env_logger = "0.11"
pollster = "0.4"
wgpu = { version = "30.0.0", default-features = false, features = [ "dx12" ] }
egui = { version = "0.36", default-features = false, features = [ "default_fonts" ] }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
winit = { version = "0.30.8", features = ["android-native-activity"] }

[patch.crates-io]
wgpu = { git = "https://github.com/DouglasDwyer/wgpu", rev = "ab4324acdc82c9c6f622ab752f85864012c67d05" }
